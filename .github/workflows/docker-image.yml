name: Tests et publication des images Docker

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_ACCOUNT }}

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore

      - name: Run tests
        run: dotnet test GestionOrdinateurs.Tests/GestionOrdinateurs.Tests.csproj --no-build --verbosity normal

  docker:
    runs-on: ubuntu-latest
    needs: tests
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push AuthentificationApi
        uses: docker/build-push-action@v6
        with:
          context: .
          file: AuthentificationApi/Dockerfile
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/authentificationapi:latest

      - name: Build and push GestionOrdinateurs API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: GestionOrdinateurs.API/Dockerfile
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/gestionordinateurs-api:latest

      - name: Build and push Gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: GestionOrdinateurs.Gateway/Dockerfile
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/gestionordinateurs-gateway:latest

      - name: Build and push Blazor client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: GestionOrdinateurs.Client/Dockerfile
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/gestionordinateurs-client:latest
