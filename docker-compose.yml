services:
  # PostgreSQL stocke uniquement la configuration et les utilisateurs Keycloak.
  # Les données métier de GestionOrdinateurs restent dans SQLite.
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    ports:
      - "5432:5432"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - appnet

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    # Importe automatiquement le realm, ses rôles, son client et les utilisateurs de test.
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/gestion-ordinateurs-realm.json:/opt/keycloak/data/import/gestion-ordinateurs-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appnet

  gestion-ordinateurs-api:
    image: ${DOCKER_ACCOUNT:-gestionordinateurs}/gestionordinateurs-api:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.API/Dockerfile
    container_name: gestion_ordinateurs_api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5086
      Keycloak__InternalUrl: http://keycloak:8080
      Keycloak__ExternalUrl: http://localhost:8180
      Keycloak__Realm: gestion-ordinateurs
    ports:
      - "5086:5086"
    networks:
      - appnet

  authentification-api:
    image: ${DOCKER_ACCOUNT:-gestionordinateurs}/authentificationapi:latest
    build:
      context: .
      dockerfile: AuthentificationApi/Dockerfile
    container_name: authentification_api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5292
      Services__GestionOrdinateursApi: http://gestion-ordinateurs-api:5086/
      Keycloak__InternalUrl: http://keycloak:8080
      Keycloak__Realm: gestion-ordinateurs
      Keycloak__ClientId: gestion-ordinateurs-client
      Keycloak__ClientSecret: gestion-ordinateurs-secret
    ports:
      - "5292:5292"
    depends_on:
      - gestion-ordinateurs-api
      - keycloak
    networks:
      - appnet

  gateway:
    image: ${DOCKER_ACCOUNT:-gestionordinateurs}/gestionordinateurs-gateway:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.Gateway/Dockerfile
    container_name: gestion_ordinateurs_gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5010
      Keycloak__InternalUrl: http://keycloak:8080
      Keycloak__ExternalUrl: http://localhost:8180
      Keycloak__Realm: gestion-ordinateurs
      ReverseProxy__Clusters__gestion-ordinateurs-api__Destinations__api__Address: http://gestion-ordinateurs-api:5086/
    ports:
      - "5010:5010"
    depends_on:
      - gestion-ordinateurs-api
      - keycloak
    networks:
      - appnet

  client:
    image: ${DOCKER_ACCOUNT:-gestionordinateurs}/gestionordinateurs-client:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.Client/Dockerfile
    container_name: gestion_ordinateurs_client
    ports:
      - "5000:5000"
    depends_on:
      - authentification-api
      - gateway
    networks:
      - appnet

volumes:
  keycloak_postgres_data:

networks:
  appnet:
    driver: bridge
